[project]
name = "line-rag-qa-bot"
version = "0.1.0"
description = "LINEにPDFを送ると内容を記憶し、質問に文書ベースで回答するRAG QA Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.115.0",
    "chromadb>=1.5.9",
    "fastapi>=0.138.2",
    "line-bot-sdk>=3.23.1",
    "onnxruntime==1.23.2",
    "openai>=2.44.0",
    "pdfplumber>=0.11.10",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort（importの並び順）
    "UP", # pyupgrade（新しい書き方への統一）
    "B",  # flake8-bugbear（バグの温床になりやすいパターン検出）
]
